<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Bulk Sender</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Segoe UI', sans-serif;
            padding: 20px;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 50% 50%, rgba(0,255,255,0.15) 0%, rgba(0,0,0,0.6) 100%);
            backdrop-filter: blur(8px);
            pointer-events: none;
        }
        .container { max-width: 1400px; margin: 0 auto; position: relative; z-index: 1; }
        .header {
            text-align: center;
            padding: 30px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            margin-bottom: 30px;
            border: 1px solid rgba(0,255,255,0.3);
            animation: glow 2s ease-in-out infinite alternate;
        }
        @keyframes glow {
            from { box-shadow: 0 0 20px rgba(0,255,255,0.2); }
            to { box-shadow: 0 0 40px rgba(0,255,255,0.5); }
        }
        .header h1 { color: #00ffff; font-size: 2.5em; }
        .status { display: inline-block; margin-left: 20px; padding: 5px 15px; border-radius: 20px; font-size: 14px; }
        .connected { background: #00ff0055; color: #0f0; border: 1px solid #0f0; }
        .disconnected { background: #ff000055; color: #f00; border: 1px solid #f00; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 25px; margin-bottom: 25px; }
        .card {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(0,255,255,0.2);
            transition: 0.3s;
        }
        .card:hover { border-color: rgba(0,255,255,0.6); transform: translateY(-3px); }
        .card-title { color: #00ffff; font-size: 1.5em; margin-bottom: 20px; border-bottom: 2px solid rgba(0,255,255,0.3); padding-bottom: 10px; }
        .input-group { margin-bottom: 18px; }
        label { display: block; color: #fff; margin-bottom: 8px; }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(0,255,255,0.3);
            border-radius: 10px;
            color: #fff;
        }
        input:focus, textarea:focus { outline: none; border-color: #00ffff; }
        button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-right: 10px;
            margin-top: 10px;
            transition: 0.3s;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0,255,255,0.4); }
        .btn-success { background: linear-gradient(135deg, #00b4db, #0083b0); }
        .btn-danger { background: linear-gradient(135deg, #f093fb, #f5576c); }
        .console {
            background: rgba(0,0,0,0.85);
            border-radius: 20px;
            padding: 20px;
            margin-top: 25px;
        }
        .console-header { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .console-title { color: #00ffff; font-size: 1.3em; }
        .console-logs {
            background: rgba(0,0,0,0.5);
            height: 300px;
            overflow-y: auto;
            padding: 15px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 12px;
        }
        .log-entry { padding: 5px; margin: 5px 0; border-left: 3px solid cyan; color: #0f0; }
        .log-error { border-left-color: red; color: #ff6666; }
        .log-success { border-left-color: #0f0; color: #0f0; }
        .log-warning { border-left-color: yellow; color: yellow; }
        .qr-container { text-align: center; margin-top: 15px; }
        .qr-container img { max-width: 200px; border-radius: 15px; }
        .progress-bar {
            width: 100%;
            height: 30px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ffff, #4facfe);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 WhatsApp Bulk Sender <span id="statusBadge" class="status disconnected">● Disconnected</span></h1>
            <p>Multi-Device Support | Bulk Messaging | API Included</p>
        </div>
        <div class="grid">
            <div class="card">
                <div class="card-title">📱 STEP 1: PAIR DEVICE</div>
                <div class="input-group">
                    <label>📞 Your Number (with country code)</label>
                    <input type="text" id="phoneNumber" placeholder="923001234567">
                </div>
                <button class="btn-success" onclick="getPairingCode()">🔐 GET PAIRING CODE</button>
                <button class="btn-success" onclick="connectDevice()">🔗 CONNECT DEVICE</button>
                <div id="qrContainer" class="qr-container"></div>
                <div id="pairingResult" style="margin-top: 15px; color: cyan;"></div>
            </div>
            <div class="card">
                <div class="card-title">📤 STEP 2: SEND MESSAGES</div>
                <div class="input-group">
                    <label>Target Type</label>
                    <select id="targetType">
                        <option value="number">Phone Number</option>
                        <option value="group">Group ID</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Target Numbers / Group ID</label>
                    <textarea id="targets" rows="3" placeholder="923001234567"></textarea>
                    <input type="text" id="groupId" placeholder="Group ID" style="display:none;">
                </div>
                <div class="input-group">
                    <label>Message Prefix</label>
                    <input type="text" id="messagePrefix" placeholder="Hello!">
                </div>
                <div class="input-group">
                    <label>Message</label>
                    <textarea id="messageText" rows="3" placeholder="Type message here..."></textarea>
                </div>
                <div class="input-group">
                    <label>Or Load .txt File</label>
                    <input type="file" id="messageFile" accept=".txt">
                </div>
                <div class="input-group">
                    <label>Delay (seconds)</label>
                    <input type="number" id="delay" value="2">
                </div>
                <div class="input-group">
                    <label>Cycles (-1 = Infinite)</label>
                    <input type="number" id="cycles" value="1">
                </div>
                <button class="btn-success" onclick="startSending()">▶ START</button>
                <button class="btn-danger" onclick="stopSending()">⏹️ STOP</button>
                <div id="progressArea" style="display:none; margin-top:15px;">
                    <div class="progress-bar"><div class="progress-fill" id="progressFill">0%</div></div>
                    <p id="progressText" style="color:white; margin-top:10px;"></p>
                </div>
            </div>
            <div class="card">
                <div class="card-title">⚙️ STEP 3: CONTROL</div>
                <button onclick="viewSession()">👁️ VIEW SESSION</button>
                <button onclick="getGroups()">👥 GET GROUPS</button>
                <button class="btn-danger" onclick="stopSession()">🛑 STOP SESSION</button>
                <div id="groupsList" style="margin-top: 15px; max-height: 250px; overflow-y: auto;"></div>
            </div>
        </div>
        <div class="console">
            <div class="console-header">
                <div class="console-title">📋 LIVE LOGS</div>
                <button onclick="clearLogs()">🗑️ CLEAR</button>
            </div>
            <div class="console-logs" id="consoleLogs"></div>
        </div>
    </div>
    <script>
        const socket = io();
        function addLog(msg, type='info') {
            const logs = document.getElementById('consoleLogs');
            const div = document.createElement('div');
            div.className = 'log-entry log-'+type;
            div.innerHTML = '['+new Date().toLocaleTimeString()+'] '+msg;
            logs.appendChild(div);
            logs.scrollTop = logs.scrollHeight;
        }
        function clearLogs() { document.getElementById('consoleLogs').innerHTML = ''; addLog('Cleared','info'); }
        
        socket.on('log', (d) => addLog(d.message, d.type));
        socket.on('qr', (qr) => { document.getElementById('qrContainer').innerHTML = '<img src="'+qr+'"><p>Scan QR Code</p>'; addLog('QR generated','warning'); });
        socket.on('connected', (s) => {
            const badge = document.getElementById('statusBadge');
            if(s) { badge.innerHTML = '● Connected'; badge.className = 'status connected'; addLog('Connected!','success'); }
            else { badge.innerHTML = '● Disconnected'; badge.className = 'status disconnected'; addLog('Disconnected','error'); }
        });
        socket.on('pairingCode', (c) => { document.getElementById('pairingResult').innerHTML = 'Pairing Code: <strong>'+c+'</strong>'; addLog('Code: '+c,'success'); });
        socket.on('groups', (g) => {
            let html = '<h4 style="color:cyan;">Your Groups:</h4>';
            g.forEach(gr => { html += '<div style="background:rgba(0,255,255,0.1); margin:5px; padding:10px; border-radius:8px;"><b>'+gr.name+'</b><br>ID: '+gr.id+'<br>Members: '+gr.participantCount+'</div>'; });
            document.getElementById('groupsList').innerHTML = html;
            addLog('Loaded '+g.length+' groups','success');
        });
        socket.on('progress', (p) => {
            const percent = Math.round(p.current/p.total*100);
            document.getElementById('progressFill').style.width = percent+'%';
            document.getElementById('progressFill').innerHTML = percent+'%';
            document.getElementById('progressText').innerHTML = 'Sent: '+p.sent+' | '+p.current+'/'+p.total;
        });
        socket.on('completed', (d) => { document.getElementById('progressArea').style.display = 'none'; addLog('Completed! Sent '+d.totalSent+' msgs','success'); });
        
        function getPairingCode() { let n = document.getElementById('phoneNumber').value; if(!n){ addLog('Enter number','error'); return; } socket.emit('getPairingCode', n); addLog('Requesting code for '+n,'info'); }
        function connectDevice() { socket.emit('connectDevice'); addLog('Connecting...','info'); }
        function getGroups() { socket.emit('getGroups'); addLog('Fetching groups...','info'); }
        function viewSession() { addLog('Session: '+ (document.getElementById('statusBadge').innerText.includes('Connected')?'Active':'Inactive'),'info'); }
        function stopSession() { socket.emit('stopSending'); addLog('Stopping...','warning'); }
        function startSending() {
            let targetType = document.getElementById('targetType').value;
            let targets = document.getElementById('targets').value;
            let groupId = document.getElementById('groupId').value;
            let prefix = document.getElementById('messagePrefix').value;
            let msg = document.getElementById('messageText').value;
            let delay = parseInt(document.getElementById('delay').value);
            let cycles = parseInt(document.getElementById('cycles').value);
            let file = document.getElementById('messageFile').files[0];
            
            if(file) {
                let reader = new FileReader();
                reader.onload = function(e) { send(targetType,targets,groupId,prefix,e.target.result,delay,cycles); };
                reader.readAsText(file);
            } else { send(targetType,targets,groupId,prefix,msg,delay,cycles); }
        }
        function send(tt,tg,gi,pr,msg,dl,cy) {
            if(!msg){ addLog('Enter message','error'); return; }
            let fullMsg = pr ? pr+'\n\n'+msg : msg;
            let data = { targetType:tt, targets:tt==='number'?tg:'', groupId:tt==='group'?gi:'', messageText:fullMsg, delay:dl, cycles:cy };
            document.getElementById('progressArea').style.display = 'block';
            socket.emit('startSending', data);
            addLog('Started sending...','success');
        }
        function stopSending() { socket.emit('stopSending'); addLog('Stopping...','warning'); }
        document.getElementById('targetType').addEventListener('change', function() {
            let isGroup = this.value === 'group';
            document.getElementById('targets').style.display = isGroup ? 'none' : 'block';
            document.getElementById('groupId').style.display = isGroup ? 'block' : 'none';
        });
    </script>
</body>
</html>
